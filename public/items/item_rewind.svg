<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="timeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sandGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="rewindShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#timeGlow)" />
  <!-- Mystic Orbit Ring -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="12 6" opacity="0.5"/>
  
  <!-- Hourglass / Scroll Frame -->
  <g filter="url(#rewindShadow)">
    <!-- Top & Bottom Plates -->
    <path d="M 36 24 L 92 24 C 94 24 96 26 94 28 L 88 34 L 40 34 L 34 28 C 32 26 34 24 36 24 Z" fill="url(#goldFrame)" stroke="#fbbf24" stroke-width="1"/>
    <path d="M 36 104 L 92 104 C 94 104 96 102 94 100 L 88 94 L 40 94 L 34 100 C 32 102 34 104 36 104 Z" fill="url(#goldFrame)" stroke="#fbbf24" stroke-width="1"/>
    
    <!-- Glass Bulbs -->
    <path d="M 42 34 Q 64 62 46 94 L 82 94 Q 64 62 86 34 Z" fill="rgba(15, 23, 42, 0.75)" stroke="url(#goldFrame)" stroke-width="2"/>
    <path d="M 46 36 Q 64 60 52 88 L 76 88 Q 64 60 82 36 Z" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>

    <!-- Flowing Time Sand -->
    <path d="M 48 40 Q 64 54 62 62 Q 60 54 80 40 Z" fill="url(#sandGlow)" opacity="0.85"/>
    <line x1="64" y1="58" x2="64" y2="78" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 52 86 Q 64 72 76 86 Z" fill="url(#sandGlow)"/>

    <!-- Swirling Temporal Reversal Arrows -->
    <path d="M 28 54 A 38 38 0 0 1 64 26" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="24,54 32,54 28,46" fill="#38bdf8"/>
    
    <path d="M 100 74 A 38 38 0 0 1 64 102" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="104,74 96,74 100,82" fill="#38bdf8"/>
  </g>
</svg>
