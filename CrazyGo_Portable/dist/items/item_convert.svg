<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="yinYangGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="convertShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#7c3aed" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#yinYangGlow)" />
  
  <!-- Swirling Mystic Taijitu Runes -->
  <circle cx="64" cy="64" r="48" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6"/>
  <circle cx="64" cy="64" r="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="10 4" opacity="0.5"/>

  <!-- Yin Yang Taijitu Transmutation Orb -->
  <g filter="url(#convertShadow)">
    <!-- Golden Energy Rim -->
    <circle cx="64" cy="64" r="36" fill="#0f172a" stroke="url(#orbBorder)" stroke-width="3"/>
    
    <!-- White / Light Hemisphere (Yang) -->
    <path d="M 64 28 A 36 36 0 0 1 64 100 A 18 18 0 0 1 64 64 A 18 18 0 0 0 64 28 Z" fill="#f8fafc"/>
    
    <!-- Dark Hemisphere (Yin) -->
    <path d="M 64 28 A 36 36 0 0 0 64 100 A 18 18 0 0 0 64 64 A 18 18 0 0 1 64 28 Z" fill="#090d16"/>
    
    <!-- Yin & Yang Dots -->
    <circle cx="64" cy="46" r="6" fill="#090d16" stroke="#c084fc" stroke-width="1.5"/>
    <circle cx="64" cy="82" r="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Transmutation Sparkles -->
    <circle cx="28" cy="48" r="2.5" fill="#c084fc"/>
    <circle cx="100" cy="80" r="2.5" fill="#38bdf8"/>
    <circle cx="48" cy="98" r="2" fill="#fbbf24"/>
    <circle cx="80" cy="30" r="2" fill="#a855f7"/>
  </g>
</svg>
