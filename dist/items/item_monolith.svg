<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="monoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="monolithBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="monoStone" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="monolithShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#monoGlow)" />
  
  <!-- Monolith 2x2 Titan Block Body -->
  <g filter="url(#monolithShadow)">
    <!-- Base Titan Block -->
    <rect x="30" y="30" width="68" height="68" rx="10" fill="url(#monolithBody)" stroke="#f59e0b" stroke-width="2.5"/>
    
    <!-- 2x2 Grid Divisions -->
    <line x1="64" y1="32" x2="64" y2="96" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 2"/>
    <line x1="32" y1="64" x2="96" y2="64" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="4 2"/>
    
    <!-- 4 Stones Embedded in Block -->
    <circle cx="47" cy="47" r="10" fill="url(#monoStone)" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="81" cy="47" r="10" fill="url(#monoStone)" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="47" cy="81" r="10" fill="url(#monoStone)" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="81" cy="81" r="10" fill="url(#monoStone)" stroke="#94a3b8" stroke-width="1"/>

    <!-- Central Runic Titan Core -->
    <circle cx="64" cy="64" r="7" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"/>
    <circle cx="64" cy="64" r="3" fill="#ffffff"/>
  </g>
</svg>
