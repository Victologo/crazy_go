<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="innerSeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Background Glow -->
  <circle cx="64" cy="64" r="54" fill="url(#shieldGlow)" />
  
  <!-- Sacred Shinto Torii / Sun Aura -->
  <circle cx="64" cy="60" r="44" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6"/>
  <circle cx="64" cy="60" r="48" fill="none" stroke="#f59e0b" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Divine Shield Crest -->
  <g filter="url(#shieldShadow)">
    <!-- Outer Golden Crest -->
    <path d="M 64 18 C 86 18 100 24 104 46 C 104 78 84 104 64 114 C 44 104 24 78 24 46 C 28 24 42 18 64 18 Z" fill="url(#goldPlate)" stroke="#fef08a" stroke-width="2"/>
    
    <!-- Inner Dark Lacquer Inlay -->
    <path d="M 64 26 C 80 26 92 30 96 48 C 96 74 80 96 64 104 C 48 96 32 74 32 48 C 36 30 48 26 64 26 Z" fill="url(#innerSeal)" stroke="#d97706" stroke-width="1.5"/>

    <!-- Sacred Golden Emblem (Japanese Mitsudomoe / Sun Knot) -->
    <circle cx="64" cy="60" r="18" fill="none" stroke="#fef08a" stroke-width="2.5"/>
    <circle cx="64" cy="60" r="10" fill="#fbbf24" opacity="0.85"/>
    <path d="M 64 42 A 18 18 0 0 1 78 72 A 18 18 0 0 1 50 72 Z" fill="#fef9c3" opacity="0.9"/>
    
    <!-- Protective Light Rays -->
    <line x1="64" y1="30" x2="64" y2="38" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <line x1="64" y1="82" x2="64" y2="90" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <line x1="38" y1="60" x2="46" y2="60" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
    <line x1="82" y1="60" x2="90" y2="60" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
