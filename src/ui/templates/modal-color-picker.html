<!-- ================= MODAL: COLOR PICKER (ALCHEMIST 4P) ================= -->
<div id="modal-color-picker" class="modal-backdrop hidden" style="z-index: 3000;">
  <div class="modal-card" style="max-width: 400px;">
    <div class="modal-header">
      <h2 data-i18n="alchemist.color_picker_title">🖌️ Elegir Color de Transmutación</h2>
      <p class="modal-desc" data-i18n="alchemist.color_picker_desc">Selecciona de qué color se pintará la piedra objetivo.</p>
    </div>
    <div class="modal-body" style="display: flex; gap: 1rem; justify-content: center; padding: 2rem 0;">
      <button class="btn btn-choice color-picker-btn" data-color="1" style="background-color: #222; color: #fff; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #555;">⚫</button>
      <button class="btn btn-choice color-picker-btn" data-color="2" style="background-color: #eee; color: #000; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #aaa;">⚪</button>
      <button class="btn btn-choice color-picker-btn" data-color="3" style="background-color: #16a34a; color: #fff; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #14532d;">🟢</button>
      <button class="btn btn-choice color-picker-btn" data-color="4" style="background-color: #9333ea; color: #fff; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #581c87;">🟣</button>
    </div>
    <div class="modal-footer" style="justify-content: center;">
      <button id="btn-cancel-color-picker" class="btn btn-secondary" data-i18n="ui.cancel">Cancelar</button>
    </div>
  </div>
</div>
