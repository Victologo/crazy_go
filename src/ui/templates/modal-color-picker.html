<!-- ================= MODAL: COLOR PICKER (ALCHEMIST 4P) ================= -->
<div id="modal-color-picker" class="modal-backdrop hidden" style="z-index: 3000;">
  <div class="modal-card" style="max-width: 440px;">
    <div class="modal-header">
      <h2 data-i18n="alchemist.color_picker_title">🖌️ Transmutación Cromática</h2>
      <p class="modal-desc" data-i18n="alchemist.color_picker_desc">Selecciona de qué color se pintará la piedra objetivo:</p>
    </div>
    <div class="modal-body" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.85rem; padding: 1.25rem 0.5rem;">
      <button class="btn color-picker-btn" data-color="1" style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1rem; background: linear-gradient(135deg, #1e293b, #0f172a); border: 2px solid #475569; border-radius: 12px; color: #f8fafc; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease;">
        <span style="font-size: 1.3rem;">⚫</span>
        <span>Negro (P1)</span>
      </button>
      <button class="btn color-picker-btn" data-color="2" style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1rem; background: linear-gradient(135deg, #f8fafc, #e2e8f0); border: 2px solid #cbd5e1; border-radius: 12px; color: #0f172a; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease;">
        <span style="font-size: 1.3rem;">⚪</span>
        <span>Blanco (P2)</span>
      </button>
      <button class="btn color-picker-btn" data-color="3" style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1rem; background: linear-gradient(135deg, #059669, #047857); border: 2px solid #10b981; border-radius: 12px; color: #ffffff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease;">
        <span style="font-size: 1.3rem;">🟢</span>
        <span>Esmeralda (P3)</span>
      </button>
      <button class="btn color-picker-btn" data-color="4" style="display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.85rem 1rem; background: linear-gradient(135deg, #7c3aed, #6d28d9); border: 2px solid #8b5cf6; border-radius: 12px; color: #ffffff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s ease;">
        <span style="font-size: 1.3rem;">🟣</span>
        <span>Amatista (P4)</span>
      </button>
    </div>
    <div class="modal-footer" style="justify-content: center;">
      <button id="btn-cancel-color-picker" class="btn btn-secondary" data-i18n="ui.cancel" style="padding: 0.6rem 2rem;">Cancelar</button>
    </div>
  </div>
</div>
